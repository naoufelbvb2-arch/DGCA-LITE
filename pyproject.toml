[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dgca-lite"
version = "0.3.0"
description = "Faithful reference implementation of DGCA LITE Layer 1 Core v0.3"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
